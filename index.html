<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как пережить осень 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0906;
  --bg-2:#120d08;
  --ink:#f7f3ee;
  --ink-dim:rgba(247,243,238,.80);
  --ink-faint:rgba(247,243,238,.55);
  --orange:#d2733a;
  --orange-soft:#e8934f;
  --orange-deep:#a8501f;
  --line:rgba(247,243,238,.14);
  --font:'Onest','Corbel','Candara','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
.stage{
  position:relative;width:100vw;height:100dvh;min-height:100vh;overflow:hidden;
  background:
    radial-gradient(70% 60% at 78% 6%, rgba(210,115,58,.16), transparent 62%),
    radial-gradient(60% 60% at 4% 96%, rgba(168,80,31,.12), transparent 60%),
    linear-gradient(170deg,var(--bg-2) 0%, var(--bg) 60%, #070504 100%);
}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.7;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, rgba(255,255,255,.85), transparent),
    radial-gradient(1.2px 1.2px at 28% 68%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.6px 1.6px at 46% 14%, rgba(255,255,255,.75), transparent),
    radial-gradient(1.1px 1.1px at 62% 82%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.5px 1.5px at 78% 34%, rgba(255,255,255,.8), transparent),
    radial-gradient(1.2px 1.2px at 88% 62%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.3px 1.3px at 8% 88%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.1px 1.1px at 36% 44%, rgba(255,255,255,.45), transparent),
    radial-gradient(1.4px 1.4px at 68% 8%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.2px 1.2px at 94% 18%, rgba(255,255,255,.55), transparent);
}
.progress{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(247,243,238,.10);z-index:9}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange-deep),var(--orange-soft));width:0;transition:width .3s ease}
.hud{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;
  padding:0 clamp(24px,3.4vw,64px);font-size:clamp(11px,.85vw,15px);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-faint);z-index:9}
.hud b{color:var(--orange-soft);font-weight:600}
.navzone{position:absolute;top:0;bottom:0;width:16%;z-index:8;cursor:pointer}
.navzone.prev{left:0}.navzone.next{right:0}

/* ---------- slide shell ---------- */
.slide{
  position:absolute;inset:0;display:none;
  padding:clamp(30px,4vw,72px) clamp(34px,4.6vw,84px) clamp(64px,5vw,92px);
}
.slide.active{display:flex;flex-direction:column;justify-content:center;animation:in .38s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.body{display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,1.5vw,26px);min-width:0;
  width:100%;height:100%}
.slide.has-art .body{max-width:56%}

/* ---------- type ---------- */
.chip{display:inline-block;align-self:flex-start;background:var(--orange-deep);color:#fff;
  font-size:clamp(13px,1.05vw,19px);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  padding:.5em 1.05em;border-radius:8px}
h1{font-size:clamp(34px,4.4vw,78px);line-height:1.03;font-weight:600;letter-spacing:-.02em}
h1.mega{font-size:clamp(44px,6.6vw,124px);line-height:.98;font-weight:700}
h2{font-size:clamp(28px,3.4vw,60px);line-height:1.06;font-weight:600;letter-spacing:-.015em}
.lead{font-size:clamp(17px,1.6vw,30px);line-height:1.42;color:var(--ink-dim);max-width:46ch}
.lead.wide{max-width:70ch}
.lead b,.plate b,h1 b,h2 b{color:var(--orange-soft);font-weight:600}
.foot{font-size:clamp(14px,1.15vw,22px);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- plates ---------- */
.plates{display:grid;gap:clamp(12px,1.2vw,22px)}
.plates.c2{grid-template-columns:1fr 1fr}
.plates.c3{grid-template-columns:repeat(3,1fr)}
.plates.c4{grid-template-columns:repeat(4,1fr)}
.plate{border:2px solid var(--orange);border-radius:16px;padding:clamp(16px,1.5vw,30px) clamp(18px,1.7vw,34px);
  background:rgba(210,115,58,.07)}
.plate.solid{background:var(--orange-deep);border-color:var(--orange-deep)}
.plate .pt{font-size:clamp(19px,1.85vw,34px);font-weight:600;line-height:1.15;margin-bottom:.32em}
.plate .pb{font-size:clamp(15px,1.35vw,25px);line-height:1.34;color:var(--ink-dim)}
.plate.solid .pb{color:rgba(255,255,255,.9)}
.plate .num{font-size:clamp(26px,2.6vw,48px);font-weight:700;color:var(--orange-soft);line-height:1;margin-bottom:.18em}

/* ---------- bullets ---------- */
ul.big{list-style:none;display:flex;flex-direction:column;gap:clamp(10px,1vw,20px)}
ul.big li{position:relative;padding-left:1.6em;font-size:clamp(18px,1.72vw,33px);line-height:1.3}
ul.big li::before{content:"";position:absolute;left:0;top:.42em;width:.62em;height:.62em;border-radius:50%;
  background:var(--orange);box-shadow:0 0 0 4px rgba(210,115,58,.18)}
ul.big.num{counter-reset:n}
ul.big.num li{padding-left:2.1em}
ul.big.num li::before{counter-increment:n;content:counter(n);background:none;box-shadow:none;
  width:auto;height:auto;top:0;color:var(--orange-soft);font-weight:700;font-size:1.05em}

/* ---------- steps (chevrons) ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1vw,20px)}
.steps .st .bar{border:2px solid var(--orange);border-radius:10px;padding:.55em 0;text-align:center;
  font-size:clamp(17px,1.55vw,30px);font-weight:700;color:var(--ink);background:rgba(210,115,58,.10)}
.steps .st .lbl{margin-top:.55em;font-size:clamp(16px,1.45vw,28px);font-weight:600}
.steps .st .sub{margin-top:.18em;font-size:clamp(14px,1.2vw,23px);color:var(--ink-dim);line-height:1.3}

/* ---------- art (half-bleed) ---------- */
.artbleed{position:absolute;right:0;top:0;bottom:0;width:42%;overflow:hidden;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 30%)}
.artbleed svg{width:100%;height:100%;display:block}
.photobleed{position:absolute;right:0;top:0;bottom:0;width:34%;overflow:hidden;z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 34%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 34%)}
.photobleed img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;
  filter:saturate(.96) contrast(1.02)}
.photobleed::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(11,9,6,.92) 0%,rgba(11,9,6,.35) 26%,rgba(11,9,6,0) 55%),
             linear-gradient(0deg,rgba(11,9,6,.55) 0%,rgba(11,9,6,0) 30%)}
@media (max-width:900px){.photobleed{display:none}}
.slide .body{position:relative;z-index:2}
.slide.wide .body{max-width:100%!important}
.slide.wide .artbleed{width:26%;opacity:.3;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 62%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 62%)}

/* ---------- special ---------- */
.center{align-items:center;text-align:center}
.center .lead{margin:0 auto}
.quote h1{max-width:22ch}
.stat .val{font-size:clamp(60px,9vw,180px);font-weight:700;line-height:.9;color:var(--orange-soft)}
.divider .no{font-size:clamp(48px,7vw,140px);font-weight:700;color:rgba(210,115,58,.35);line-height:.9}
@media (max-width:900px){
  .artbleed{display:none}
  .slide.has-art .body{max-width:100%}
  .plates.c3,.plates.c4{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
}

/* ---------- телефон ---------- */
@media (max-width:820px){
  .slide{padding:18px 20px 62px;overflow-y:auto}
  .slide.active{justify-content:flex-start;padding-top:34px}
  .artbleed{display:none}
  .slide.has-art .body,.slide.wide .body{max-width:100%!important}
  h1{font-size:30px}h1.mega{font-size:46px}h2{font-size:26px}
  .lead{font-size:16px;max-width:none}
  .chip{font-size:11px}
  ul.big li{font-size:17px}
  .plates.c2,.plates.c3,.plates.c4{grid-template-columns:1fr}
  .plate .pt{font-size:19px}.plate .pb{font-size:15px}
  .plate .num{font-size:26px}
  .navzone{width:26%}
  .hud{bottom:12px;font-size:10px}
}
@media (prefers-reduced-motion:reduce){.slide.active{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="glow" cx="50%" cy="50%"><stop offset="0%" stop-color="#e8934f" stop-opacity=".85"/><stop offset="60%" stop-color="#a8501f" stop-opacity=".25"/><stop offset="100%" stop-color="#a8501f" stop-opacity="0"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7d9a8"/><stop offset="45%" stop-color="#d2733a"/><stop offset="100%" stop-color="#7c3a12"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c1109"/><stop offset="100%" stop-color="#050402"/></linearGradient>
</defs></svg>

<div class="stage">
  <div class="stars"></div>
  <div class="progress"><i id="pf"></i></div>
  <div id="root"></div>
  <div class="navzone prev" id="prev"></div>
  <div class="navzone next" id="next"></div>
  <div class="hud"><b id="sec">Астрологика</b><span id="cnt">01 / 41</span></div>
</div>

<script>
/* ================= ИЛЛЮСТРАЦИИ (SVG) ================= */
function stars(n,seed){let s='';let r=seed||7;
  for(let i=0;i<n;i++){r=(r*9301+49297)%233280;const x=(r/233280*100).toFixed(1);
    r=(r*9301+49297)%233280;const y=(r/233280*100).toFixed(1);
    r=(r*9301+49297)%233280;const o=(0.25+r/233280*0.7).toFixed(2);
    s+=`<circle cx="${x}" cy="${y}" r="${(0.25+ (i%3)*0.18).toFixed(2)}" fill="#fff" opacity="${o}"/>`;}
  return s;}

const DEFS = '';

function artZodiac(){return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect x="-50" y="-50" width="200" height="200" fill="url(#sky)"/>${stars(70,3)}
  <circle cx="50" cy="48" r="34" fill="url(#glow)" opacity=".55"/>
  <g fill="none" stroke="#e8934f" stroke-width=".5" opacity=".9">
    <circle cx="50" cy="48" r="30"/><circle cx="50" cy="48" r="22" opacity=".55"/>
  </g>
  <g fill="#f7d9a8" font-size="7" text-anchor="middle" font-family="Segoe UI Symbol,serif" opacity=".95">
    <text x="50" y="21">♈</text><text x="71" y="27">♉</text><text x="81" y="46">♊</text>
    <text x="76" y="66">♋</text><text x="58" y="76">♌</text><text x="40" y="76">♍</text>
    <text x="24" y="66">♎</text><text x="19" y="46">♏</text><text x="29" y="27">♐</text>
  </g>
  <circle cx="50" cy="48" r="6" fill="url(#metal)"/>
</svg>`;}

function artRetro(){return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect x="-50" y="-50" width="200" height="200" fill="url(#sky)"/>${stars(60,11)}
  <ellipse cx="50" cy="52" rx="40" ry="16" fill="none" stroke="#f7f3ee" stroke-width=".4" opacity=".25"/>
  <path d="M8 60 C26 60 30 34 46 34 C60 34 58 58 44 58 C32 58 34 34 52 34 C72 34 78 60 94 60"
        fill="none" stroke="#e8934f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="44" cy="58" r="3.2" fill="url(#metal)"/>
  <circle cx="94" cy="60" r="2.2" fill="#f7d9a8" opacity=".8"/>
  <circle cx="50" cy="30" r="26" fill="url(#glow)" opacity=".3"/>
</svg>`;}

function artCoins(){return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect x="-50" y="-50" width="200" height="200" fill="url(#sky)"/>${stars(55,5)}
  <circle cx="52" cy="60" r="34" fill="url(#glow)" opacity=".5"/>
  <g>
    <ellipse cx="38" cy="78" rx="17" ry="6" fill="url(#metal)"/>
    <ellipse cx="38" cy="72" rx="17" ry="6" fill="url(#metal)" opacity=".92"/>
    <ellipse cx="38" cy="66" rx="17" ry="6" fill="url(#metal)" opacity=".84"/>
    <ellipse cx="66" cy="80" rx="14" ry="5" fill="url(#metal)" opacity=".9"/>
    <ellipse cx="66" cy="75" rx="14" ry="5" fill="url(#metal)" opacity=".8"/>
    <circle cx="60" cy="50" r="11" fill="url(#metal)"/>
    <text x="60" y="55" font-size="11" text-anchor="middle" fill="#3a1a06" font-family="Segoe UI,sans-serif" font-weight="700">₽</text>
  </g>
</svg>`;}

function artHourglass(){return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect x="-50" y="-50" width="200" height="200" fill="url(#sky)"/>${stars(60,17)}
  <circle cx="50" cy="50" r="30" fill="url(#glow)" opacity=".45"/>
  <g stroke="#e8934f" stroke-width="1.4" fill="none">
    <rect x="30" y="16" width="40" height="3" rx="1.5" fill="#e8934f"/>
    <rect x="30" y="81" width="40" height="3" rx="1.5" fill="#e8934f"/>
    <path d="M34 19 L34 30 L50 50 L66 30 L66 19"/>
    <path d="M34 81 L34 70 L50 50 L66 70 L66 81"/>
  </g>
  <path d="M36 24 L64 24 L50 45 Z" fill="url(#metal)" opacity=".85"/>
  <path d="M38 78 L62 78 L50 62 Z" fill="url(#metal)" opacity=".75"/>
  <line x1="50" y1="47" x2="50" y2="70" stroke="#f7d9a8" stroke-width=".7" opacity=".8"/>
</svg>`;}

function artDoors(){return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect x="-50" y="-50" width="200" height="200" fill="url(#sky)"/>${stars(50,23)}
  <rect x="22" y="28" width="24" height="52" rx="3" fill="none" stroke="#f7f3ee" stroke-width="1" opacity=".4"/>
  <circle cx="41" cy="55" r="1.6" fill="#f7f3ee" opacity=".4"/>
  <rect x="54" y="28" width="24" height="52" rx="3" fill="url(#glow)" stroke="#e8934f" stroke-width="1.6"/>
  <rect x="57" y="31" width="18" height="46" rx="2" fill="#e8934f" opacity=".22"/>
  <circle cx="73" cy="55" r="1.8" fill="#f7d9a8"/>
  <path d="M50 90 L50 18" stroke="#f7f3ee" stroke-width=".3" opacity=".25" stroke-dasharray="2 3"/>
</svg>`;}

function artRings(){return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect x="-50" y="-50" width="200" height="200" fill="url(#sky)"/>${stars(55,31)}
  <circle cx="50" cy="50" r="34" fill="url(#glow)" opacity=".35"/>
  <circle cx="38" cy="52" r="20" fill="none" stroke="#e8934f" stroke-width="1.8"/>
  <circle cx="62" cy="52" r="20" fill="none" stroke="#f7d9a8" stroke-width="1.8" opacity=".85"/>
  <path d="M50 36 A20 20 0 0 1 50 68 A20 20 0 0 1 50 36" fill="#e8934f" opacity=".18"/>
</svg>`;}

function artWheel(accent){const c=accent||'#e8934f';return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect x="-50" y="-50" width="200" height="200" fill="url(#sky)"/>${stars(45,37)}
  <circle cx="50" cy="50" r="38" fill="none" stroke="${c}" stroke-width=".9"/>
  <circle cx="50" cy="50" r="29" fill="none" stroke="${c}" stroke-width=".6" opacity=".6"/>
  <circle cx="50" cy="50" r="17" fill="none" stroke="${c}" stroke-width=".5" opacity=".4"/>
  <g stroke="${c}" stroke-width=".5" opacity=".75">
    <line x1="12" y1="50" x2="88" y2="50"/><line x1="50" y1="12" x2="50" y2="88"/>
    <line x1="23" y1="23" x2="77" y2="77"/><line x1="77" y1="23" x2="23" y2="77"/>
    <line x1="31" y1="15" x2="69" y2="85"/><line x1="69" y1="15" x2="31" y2="85"/>
    <line x1="15" y1="31" x2="85" y2="69"/><line x1="15" y1="69" x2="85" y2="31"/>
  </g>
  <circle cx="50" cy="50" r="3" fill="${c}"/>
  <circle cx="50" cy="50" r="42" fill="url(#glow)" opacity=".25"/>
</svg>`;}

function artTimeline(){return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect x="-50" y="-50" width="200" height="200" fill="url(#sky)"/>${stars(50,41)}
  <circle cx="55" cy="50" r="34" fill="url(#glow)" opacity=".45"/>
  <line x1="34" y1="12" x2="34" y2="88" stroke="#e8934f" stroke-width="1.2" opacity=".85"/>
  <circle cx="34" cy="24" r="4" fill="url(#metal)"/>
  <circle cx="34" cy="42" r="4" fill="url(#metal)"/>
  <circle cx="34" cy="62" r="7.5" fill="#e8934f"/>
  <circle cx="34" cy="62" r="12" fill="none" stroke="#f7d9a8" stroke-width=".6" opacity=".7"/>
  <circle cx="34" cy="82" r="4" fill="url(#metal)" opacity=".85"/>
  <g fill="none" stroke="#f7d9a8" stroke-width=".5" opacity=".35">
    <circle cx="70" cy="34" r="14"/><circle cx="70" cy="34" r="22"/>
  </g>
  <circle cx="70" cy="34" r="4.5" fill="url(#metal)"/>
</svg>`;}

function artGift(){return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <rect x="-50" y="-50" width="200" height="200" fill="url(#sky)"/>${stars(55,53)}
  <circle cx="50" cy="55" r="32" fill="url(#glow)" opacity=".5"/>
  <rect x="26" y="46" width="48" height="34" rx="3" fill="url(#metal)" opacity=".92"/>
  <rect x="26" y="38" width="48" height="10" rx="2" fill="#e8934f"/>
  <rect x="45" y="38" width="10" height="42" fill="#7c3a12" opacity=".55"/>
  <path d="M50 38 C42 30 34 30 36 24 C38 18 48 22 50 38 C52 22 62 18 64 24 C66 30 58 30 50 38 Z" fill="#f7d9a8"/>
</svg>`;}

const ART={zodiac:artZodiac,retro:artRetro,coins:artCoins,hourglass:artHourglass,doors:artDoors,

/* ================= РЕНДЕР ================= */
function plates(p,c){
  return `<div class="plates c${c||p.length}">`+p.map(x=>
    `<div class="plate${x.solid?' solid':''}">
       ${x.n?`<div class="num">${x.n}</div>`:''}
       <div class="pt">${x.t}</div>
       ${x.b?`<div class="pb">${x.b}</div>`:''}
     </div>`).join('')+`</div>`;
}
function bodyHTML(s){
  let h='';
  if(s.chip) h+=`<span class="chip">${s.chip}</span>`;
  if(s.h1) h+=`<h1${s.type==='quote'?'':''}>${s.h1}</h1>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.bullets) h+=`<ul class="big">`+s.bullets.map(b=>`<li>${b}</li>`).join('')+`</ul>`;
  if(s.plates) h+=plates(s.plates,s.c);
  if(s.lead) h+=`<p class="lead${s.leadWide?' wide':''}">${s.lead}</p>`;
  if(s.foot) h+=`<div class="foot">${s.foot}</div>`;
  return h;
}
function art(s){return s.art?`<div class="artbleed">${ART[s.art]()}</div>`:'';}
function photo(s){return s.photo?`<div class="photobleed"><img src="${s.photo}" alt="Ольга Прядко"></div>`:'';}
function render(s){
  if(s.type==='divider'){
    return art(s)+`<div class="body divider">
      <div class="no">${s.no}</div><h1 class="mega">${s.h1}</h1></div>`;
  }
  if(s.type==='quote'){
    return `<div class="body center quote" style="align-items:center;text-align:center;max-width:none">
      ${s.chip?`<span class="chip" style="align-self:center">${s.chip}</span>`:''}
      <h1 style="max-width:24ch">${s.h1}</h1>
      ${s.lead?`<p class="lead" style="text-align:center">${s.lead}</p>`:''}
      ${s.foot?`<div class="foot">${s.foot}</div>`:''}</div>`;
  }
  return art(s)+photo(s)+`<div class="body">${bodyHTML(s)}</div>`;
}

const root=document.getElementById('root');
S.forEach((s,i)=>{const d=document.createElement('div');
  d.className='slide'+((s.art||s.photo)&&s.type!=='quote'?' has-art':'')+(s.wide?' wide':'');
  d.innerHTML=render(s);root.appendChild(d);});
const els=[...document.querySelectorAll('.slide')];
const pf=document.getElementById('pf'),cnt=document.getElementById('cnt'),sec=document.getElementById('sec');
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(S.length-1,i));
  els.forEach((e,idx)=>e.classList.toggle('active',idx===cur));
  pf.style.width=((cur+1)/S.length*100)+'%';
  cnt.textContent=String(cur+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  sec.textContent=S[cur].sec;
  try{localStorage.setItem('efir0909',String(cur));}catch(e){}
}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  if(e.key==='Home')go(0); if(e.key==='End')go(S.length-1);
});
let start=0;try{const v=localStorage.getItem('efir0909');if(v!==null)start=Math.min(parseInt(v,10)||0,S.length-1);}catch(e){}
go(start);

let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){ go(dx<0?cur+1:cur-1); }
},{passive:true});

</script>
</body>
</html>
